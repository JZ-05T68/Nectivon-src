<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font:14px "Microsoft YaHei",sans-serif;color:#243d35}button,select,input{font:inherit;padding:7px;border:1px solid #bed0c8;border-radius:5px;background:#fff;color:inherit}button{cursor:pointer}button:disabled{opacity:.4}button.active,#save{background:#147e67;color:white}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 9px}#view{overflow:auto;height:520px;border:1px solid #bed0c8;background:#edf2ef}canvas{display:block;max-width:none;touch-action:none;cursor:crosshair}.hint,#status{line-height:1.6;margin:8px 0;color:#52665d}#description{width:220px}#option{width:35px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #147e67;outline-offset:2px}
</style></head><body>
<div class="tools"><button id="adjust" class="active">移动／调整方框</button><button id="add">添加截图方框</button><select id="figure" aria-label="选择截图方框"></select><button id="remove">删除选中方框</button><button id="minus" aria-label="缩小原图">−</button><span id="zoom"></span><button id="plus" aria-label="放大原图">＋</button><button id="fit">适应宽度</button></div>
<div class="tools"><label>用途 <select id="role" aria-label="截图用途"><option value="stem">题干图</option><option value="shared">公共图</option><option value="option">选项图</option><option value="question">本题整体截图</option></select></label><label id="optionLabel" hidden>选项 <input id="option" aria-label="截图选项编号" maxlength="1" value="A"></label><input id="description" aria-label="截图说明" placeholder="图片说明（可选）" maxlength="240"><button id="reset">撤销未保存调整</button><button id="save" disabled>保存截图方框</button></div>
<p class="hint">点击方框可选中；拖动框内可移动，拖动边角可调整。添加时在大图上拖出范围；方框的编号和颜色对应本题各张图片。</p>
<div id="view"><canvas id="canvas" aria-label="原始扫描图截图方框画布"></canvas></div><div id="status" role="status">正在加载原图…</div>
<script src="crop_geometry.js"></script><script src="editor.js"></script></body></html>
